name: Build iOS IPA (Cosmo CRM)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive (Unsigned / Ad-Hoc)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r CosmoCRM.ipa Payload
          ls -lh CosmoCRM.ipa

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoCRM-iOS-IPA
          path: build/CosmoCRM.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ios-build
          name: "Cosmo CRM iOS IPA"
          files: build/CosmoCRM.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
